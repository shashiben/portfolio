name: portfolio
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  cupertino_icons: ^2.0.0
  dev_utils: ^0.0.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^11.0.0
