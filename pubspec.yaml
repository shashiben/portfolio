  dev_utils: ^0.0.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.8.0
  get_it: ^8.0.0
  go_router: ^17.0.1
  google_fonts: ^8.0.0
