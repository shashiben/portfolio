name: Deploy Flutter Web to GitHub Pages Repo

on:
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --wasm

      # GitHub Pages has no SPA rewrite. Serving the app as 404.html keeps
      # path URLs such as /experience working on refresh.
      - name: Add path-URL fallback
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to shashiben.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: shashiben/shashiben.github.io
          publish_dir: ./build/web
          publish_branch: master
